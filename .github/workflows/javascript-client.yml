name: javascript-client

on:
  push:
    branches: [main]
  pull_request:

jobs:
  javascript-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Test the client package
        run: pnpm --filter awesome-schema test

      - name: Build the CLI
        run: cargo build -p cli --locked

      - name: Smoke the launcher
        env:
          AWESOME_SCHEMA_BIN: target/debug/awesome-schema
        run: pnpm awesome-schema validate --schema examples/awesome.schema
