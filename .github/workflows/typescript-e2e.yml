name: typescript-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        surreal_image:
          - surrealdb/surrealdb:v3.3.0
          - surrealdb/surrealdb:v4
    name: typescript-e2e (${{ matrix.surreal_image }})
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Build the client package
        run: pnpm --filter awesome-schema build

      - name: Run TypeScript client e2e
        env:
          # Fail the job if Surreal cannot start (no soft-skip in CI).
          CI: true
          SURREAL_IMAGE: ${{ matrix.surreal_image }}
        run: pnpm --filter awesome-schema-typescript-e2e test
