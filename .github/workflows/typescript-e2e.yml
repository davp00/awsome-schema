name: typescript-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/typescript/package-lock.json

      - name: Install TypeScript e2e deps
        working-directory: e2e/typescript
        run: npm ci

      - name: Run TypeScript client e2e
        working-directory: e2e/typescript
        env:
          # Fail the job if Surreal cannot start (no soft-skip in CI).
          CI: true
        run: npm test
