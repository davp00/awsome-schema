name: rust-client-e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-client-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        surreal_image:
          - surrealdb/surrealdb:v3.3.0
          - surrealdb/surrealdb:v4
    name: rust-client-e2e (${{ matrix.surreal_image }})
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust client e2e
        env:
          CI: true
          SURREAL_IMAGE: ${{ matrix.surreal_image }}
        run: cargo test -p e2e-rust --locked -- --nocapture
