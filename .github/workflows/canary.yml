name: canary

on:
  workflow_run:
    workflows: [coverage, typescript-e2e]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: canary-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  ready:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.set.outputs.go }}
      version: ${{ steps.set.outputs.version }}
      sha: ${{ steps.set.outputs.sha }}
    steps:
      - name: Require coverage and e2e on this commit
        id: set
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          go=true
          for workflow in coverage.yml typescript-e2e.yml; do
            status="$(gh api --jq '.workflow_runs[0].status // ""' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${HEAD_SHA}&event=push&per_page=1")"
            conclusion="$(gh api --jq '.workflow_runs[0].conclusion // ""' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${HEAD_SHA}&event=push&per_page=1")"
            echo "${workflow}: status=${status:-missing} conclusion=${conclusion:-missing}"
            if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
              go=false
            fi
          done
          echo "go=${go}" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "version=1.0.0-test.${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

  release:
    needs: ready
    if: needs.ready.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ready.outputs.sha }}

      - name: Open the test release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.ready.outputs.version }}
          HEAD_SHA: ${{ needs.ready.outputs.sha }}
        run: |
          tag="v${VERSION}"
          notes="Test build ${VERSION} from main at ${HEAD_SHA}."
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} already exists"
          else
            gh release create "$tag" \
              --prerelease \
              --target "${HEAD_SHA}" \
              --title "$tag" \
              --notes "$notes"
          fi
          if gh release view canary >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/canary" -f sha="${HEAD_SHA}"
            gh release edit canary --prerelease --title "canary" --notes "$notes"
          else
            gh release create canary \
              --prerelease \
              --target "${HEAD_SHA}" \
              --title "canary" \
              --notes "$notes"
          fi

  binary:
    needs: [ready, release]
    if: needs.ready.outputs.go == 'true'
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: awesome-schema-x86_64-unknown-linux-gnu
            bin: awesome-schema
          - os: macos-latest
            asset: awesome-schema-aarch64-apple-darwin
            bin: awesome-schema
          - os: windows-latest
            asset: awesome-schema-x86_64-pc-windows-msvc.exe
            bin: awesome-schema.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ready.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: canary-${{ matrix.os }}
          cache-on-failure: true
          cache-workspace-crates: true

      - name: Build release CLI
        run: cargo build --release -p cli --locked

      - name: Upload the test and canary binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.ready.outputs.version }}
        run: |
          mkdir -p dist-bin
          cp "target/release/${{ matrix.bin }}" "dist-bin/${{ matrix.asset }}"
          gh release upload "v${VERSION}" "dist-bin/${{ matrix.asset }}" --clobber
          gh release upload canary "dist-bin/${{ matrix.asset }}" --clobber

  publish:
    needs: [ready, binary]
    if: needs.ready.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.ready.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Publish the test version
        env:
          VERSION: ${{ needs.ready.outputs.version }}
        working-directory: clients/javascript
        run: |
          published="$(npm view "awesome-schema@${VERSION}" version 2>/dev/null || true)"
          if [ "$published" = "$VERSION" ]; then
            echo "awesome-schema@${VERSION} is already published"
            exit 0
          fi
          npm pkg set "version=${VERSION}"
          npm publish --access public --tag test
