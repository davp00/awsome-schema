[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/core",
    "crates/parser",
    "crates/migrations",
    "crates/codegen",
    "crates/codegen-rust",
    "crates/codegen-typescript",
    "crates/renderers",
    "crates/e2e",
]

default-members = [
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Daniel Viloria"]
license = "MIT"
repository = "https://github.com/davp00/awesome-schema"
homepage = "https://github.com/davp00/awesome-schema"
documentation = "https://github.com/davp00/awesome-schema"
description = "A schema modeling, migration and code generation toolkit."
readme = "README.md"
keywords = ["schema", "database", "migration", "orm", "codegen"]
categories = ["database", "command-line-utilities", "development-tools"]

[workspace.lints.rust]
future-incompatible = { level = "deny", priority = 1 }
nonstandard_style = { level = "deny", priority = 2 }
unsafe_code = { level = "forbid", priority = 3 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
nursery = { level = "warn", priority = 2 }

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
surrealdb = { version = "3.3.0", default-features = false, features = ["protocol-ws"] }
testcontainers-modules = { version = "0.15", features = ["surrealdb"] }
tempfile = "3.19"
assert_cmd = "2.0"
predicates = "3.1"

core = { path = "crates/core" }
schema-core = { package = "core", path = "crates/core" }
parser = { path = "crates/parser" }
migrations = { path = "crates/migrations" }
renderers = { path = "crates/renderers" }
codegen = { path = "crates/codegen" }
codegen-rust = { path = "crates/codegen-rust" }
codegen-typescript = { path = "crates/codegen-typescript" }
