[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/core",
    "crates/parser",
    "crates/migrations",
    "crates/codegen",
    "crates/codegen-rust",
    "crates/codegen-typescript",
    "crates/renderers",
    "crates/e2e",
    "clients/rust",
    "e2e/rust",
]

default-members = [
    "crates/cli",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
authors = ["Daniel Viloria"]
license = "MIT"
repository = "https://github.com/davp00/awsome-schema"
homepage = "https://github.com/davp00/awsome-schema"
documentation = "https://github.com/davp00/awsome-schema"
description = "A schema modeling, migration and code generation toolkit."
readme = "README.md"
keywords = ["schema", "database", "migration", "orm", "codegen"]
categories = ["database", "command-line-utilities", "development-tools"]

[workspace.lints.rust]
future_incompatible = { level = "deny", priority = 1 }
nonstandard_style = { level = "deny", priority = 2 }
unsafe_code = { level = "forbid", priority = 3 }

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
nursery = { level = "warn", priority = 2 }

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros"] }
surrealdb = { version = "4", default-features = false, features = ["protocol-ws"] }
testcontainers-modules = { version = "0.15", features = ["surrealdb"] }
tempfile = "3.19"
assert_cmd = "2.0"
predicates = "3.1"
ureq = { version = "3.0", default-features = false, features = ["rustls"] }

# Internal crates (path + version for crates.io publish; keys keep import names)
core = { package = "awesome-schema-core", path = "crates/core", version = "0.1.0-alpha.1" }
schema-core = { package = "awesome-schema-core", path = "crates/core", version = "0.1.0-alpha.1" }
parser = { package = "awesome-schema-parser", path = "crates/parser", version = "0.1.0-alpha.1" }
migrations = { package = "awesome-schema-migrations", path = "crates/migrations", version = "0.1.0-alpha.1" }
renderers = { package = "awesome-schema-renderers", path = "crates/renderers", version = "0.1.0-alpha.1" }
codegen = { package = "awesome-schema-codegen", path = "crates/codegen", version = "0.1.0-alpha.1" }
codegen-rust = { package = "awesome-schema-codegen-rust", path = "crates/codegen-rust", version = "0.1.0-alpha.1" }
codegen-typescript = { package = "awesome-schema-codegen-typescript", path = "crates/codegen-typescript", version = "0.1.0-alpha.1" }
client-surreal = { package = "awesome-schema-surreal", path = "clients/rust", version = "0.1.0-alpha.1" }
